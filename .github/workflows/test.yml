name: desk
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Headless desk tests
        run: python app/desktop/tests/run_tests.py

  web:
    # The web desk: typecheck, lint, the node tests (scripts/ and src/lib/crest/) and a fresh bundle build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # DamIT Core's shared defaults, for settings.test.ts (DAMIT_REPO). The damit repository is public.
      - uses: actions/checkout@v4
        with:
          repository: nickdbendickson/damit
          path: damit-ref
          sparse-checkout: |
            damit_core/data
            damit_core/lib/shared_defaults.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Script tests
        run: node --test "scripts/**/*.test.mjs"
      - name: Desk library tests
        env:
          DAMIT_REPO: ${{ github.workspace }}/damit-ref
        run: node --experimental-strip-types --test "src/lib/crest/*.test.ts"
      - name: Build the desktop bundle
        # The committed bundle carries the SHA of the commit it was built on (scripts/crest-version.mjs); build with
        # that SHA so the check below compares everything else.
        run: |
          sha=$(grep -rhoE '[0-9]+\.[0-9]+\.[0-9]+\+([0-9a-f]{7,}|local)' desktop/damit_desktop/web/assets | head -n1 | cut -d+ -f2)
          echo "Committed bundle was built at: ${sha:-unknown}"
          DAMIT_BUILD_SHA="$sha" npm run build:desktop
      - name: The committed bundle is the one src/ builds
        if: runner.os == 'Linux'
        run: git diff --exit-code -- desktop/damit_desktop/web

  engine-sync:
    # The desk engine must match ND Crest's (DWR_Plugins dwr_crest/, private). Runs only when the repository has a
    # DWR_PLUGINS_TOKEN secret that can read DWR_Plugins; otherwise it says it was skipped.
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.DWR_PLUGINS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: No DWR_Plugins token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Engine sync with DWR_Plugins dwr_crest skipped (add a DWR_PLUGINS_TOKEN secret to run it)."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          repository: nickdbendickson/DWR_Plugins
          token: ${{ secrets.DWR_PLUGINS_TOKEN }}
          path: dwr-ref
          sparse-checkout: dwr_crest
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: "24"
      - name: Engine sync with dwr_crest
        if: env.HAS_TOKEN == 'true'
        run: node app/scripts/check-engine-sync.mjs --other dwr-ref
